name: Verify current source

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
      FSP_REAL_ACCOUNTS_ENABLED: 'false'
      FSP_EMAIL_MODE: 'off'
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm run install:ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - name: Verify reproducible Sites v12 staging
        run: node scripts/prepare-sites-v12.mjs --output "$RUNNER_TEMP/fsp-sites-v12-stage"
      - name: Reproduce authored regression evidence
        run: |
          npm run evaluate
          node scripts/evaluate-matching-quality.mjs --module lib/domain.mjs --split visible --label v0.6
          npm run evaluate:assessment-quality
          node scripts/verify-two-role.mjs
      - run: npm run build
      - name: Apply local migrations and verify real HTTP launch
        run: |
          node scripts/migrate-local.mjs
          node scripts/verify-clean-launch.mjs
